server:
  port: ${PORT:8080}

spring:
  application:
    name: task-assignment-backend
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: INFO
    org.hibernate.SQL: INFO

app:
  timezone: America/Bogota
  seed:
    enabled: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:this-is-a-very-secret-key-with-at-least-256-bits-for-development-only-replace-in-prod!}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}


