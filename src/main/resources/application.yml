spring:
  application:
    name: task-assignment-backend
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: INFO
    org.hibernate.SQL: INFO

app:
  timezone: America/Bogota
  seed:
    enabled: true

